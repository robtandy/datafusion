[package]
name = "datafusion-physical-pipeline"
description = "Push-based, DuckDB-inspired pipeline execution engine for DataFusion"
keywords = ["arrow", "query", "sql", "pipeline"]
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[lib]
name = "datafusion_physical_pipeline"

# All dependencies needed by Waves 1-4 of the pipeline engine are declared up
# front so that later work can proceed in parallel without editing this file.
[dependencies]
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-ipc = { workspace = true }
arrow-ord = { workspace = true }
arrow-row = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
datafusion-common = { workspace = true }
datafusion-common-runtime = { workspace = true }
datafusion-datasource = { workspace = true }
datafusion-datasource-csv = { workspace = true }
datafusion-datasource-parquet = { workspace = true }
datafusion-execution = { workspace = true }
datafusion-expr = { workspace = true }
datafusion-functions-aggregate-common = { workspace = true }
datafusion-physical-expr = { workspace = true }
datafusion-physical-expr-common = { workspace = true }
datafusion-physical-optimizer = { workspace = true }
datafusion-physical-plan = { workspace = true }
datafusion-session = { workspace = true }
futures = { workspace = true }
hashbrown = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
object_store = { workspace = true }
parking_lot = { workspace = true }
parquet = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
datafusion = { workspace = true, default-features = true }
rand = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

# Dependencies reserved for the native operators of Waves 2-4 (sources,
# tuple data, joins, aggregates, sorts and windows) that are not referenced yet.
[package.metadata.cargo-machete]
ignored = [
    "arrow-buffer",
    "arrow-ord",
    "bytes",
    "datafusion-datasource",
    "datafusion-datasource-csv",
    "datafusion-datasource-parquet",
    "datafusion-functions-aggregate-common",
    "datafusion-physical-expr",
    "datafusion-physical-expr-common",
    "datafusion-physical-optimizer",
    "hashbrown",
    "itertools",
    "object_store",
    "parquet",
    "rand",
    "tempfile",
]
